<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina != null ? tituloPagina + ' | Classic Mueblería' : 'Classic Mueblería'}">Classic Mueblería</title>

  <!-- Bootstrap 5 (CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <!-- Bootstrap Icons (CDN) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- FontAwesome (vendorizado, usado por vistas existentes) -->
  <link th:href="@{/assets/vendor/fontawesome-7.2.0/css/all.min.css}" rel="stylesheet">
  <!-- Hoja de estilos del proyecto -->
  <link th:href="@{/assets/css/craftorder.css}" rel="stylesheet">
</head>
<body>

<!-- Toast del buscador global por token -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
  <div id="navToastError" class="toast align-items-center
       text-bg-danger border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="navToastMensaje"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<div class="d-flex">

  <!-- Sidebar -->
  <nav id="sidebar" class="sidebar flex-shrink-0 p-3" style="width:260px">

    <div class="d-flex align-items-center mb-4 px-2">
      <span class="fw-bold fs-5 text-white">
        <i class="bi bi-hammer me-2"></i>Classic Mueblería
      </span>
    </div>

    <ul class="nav flex-column gap-1">
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/dashboard}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/dashboard')} ? 'active' : ''">
          <i class="bi bi-speedometer2"></i>Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/artesanos}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/artesanos')} ? 'active' : ''">
          <i class="bi bi-people"></i>Artesanos
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/tiposmueble}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/tiposmueble')} ? 'active' : ''">
          <i class="bi bi-columns-gap"></i>Tipos de Mueble
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/materiales}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/materiales')} ? 'active' : ''">
          <i class="bi bi-tree"></i>Materiales
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/cotizaciones}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/cotizaciones')} ? 'active' : ''">
          <i class="bi bi-file-earmark-text"></i>Cotizaciones
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" th:href="@{/admin/kanban}"
           th:classappend="${seccionActiva != null and #strings.startsWith(seccionActiva, '/admin/kanban')} ? 'active' : ''">
          <i class="bi bi-tools"></i>Órdenes de Producción
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenido principal -->
  <div class="d-flex flex-column flex-grow-1 min-vh-100">

    <!-- Navbar superior -->
    <nav class="navbar px-4 py-2 d-flex align-items-center justify-content-between"
         style="background:var(--color-sidebar)">
      <button class="btn border-0 p-1 js-sidebar-toggle text-white"
              type="button" aria-label="Toggle sidebar">
        <i class="bi bi-list fs-4"></i>
      </button>
      <div class="d-flex align-items-center flex-grow-1 justify-content-end">
        <form id="formBuscadorToken"
              class="d-flex align-items-center gap-2 me-3"
              onsubmit="buscarPorToken(event)">
          <div class="input-group input-group-sm" style="width:280px">
            <input type="text"
                   id="inputToken"
                   class="form-control"
                   placeholder="Buscar por token..."
                   maxlength="32"
                   style="border-radius:6px 0 0 6px">
            <button type="submit"
                    class="btn btn-sm"
                    style="background:var(--co-primary);color:white;
                           border-radius:0 6px 6px 0">
              <i class="fa-solid fa-magnifying-glass"></i>
            </button>
          </div>
        </form>
        <div class="dropdown">
          <button class="btn border-0 dropdown-toggle d-flex align-items-center gap-2"
                  style="color:var(--co-sidebar-text)"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false">
            <i class="fa-solid fa-circle-user fa-lg"></i>
            <span th:text="${session.usuarioNombre != null ? session.usuarioNombre : 'Usuario'}">Usuario</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li>
              <a class="dropdown-item" th:href="@{/admin/cambiar-contrasena}">
                <i class="fa-solid fa-key me-2"></i>Cambiar contraseña
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <a class="dropdown-item text-danger" th:href="@{/logout}">
                <i class="fa-solid fa-right-from-bracket me-2"></i>Cerrar sesión
              </a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Zona de contenido de las vistas hijas -->
    <main class="flex-grow-1 p-4 container-fluid">
      <div layout:fragment="contenidopaginas">
        <!-- Contenido específico de cada vista -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 border-top"
            style="color:var(--co-text-secondary)">
      <small>craftorderview — Classic Mueblería</small>
    </footer>
  </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/assets/js/craftorder.js}"></script>
<script th:src="@{/assets/js/craftorder-forms.js}"></script>
<script th:src="@{/assets/js/craftorder-modals.js}"></script>
<script th:src="@{/assets/js/craftorder-kanban.js}"></script>

</body>
</html>
