<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      lang="es">
<head th:fragment="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${tituloPagina != null ? tituloPagina + ' | Classic Mueblería' :
                   'Classic Mueblería'}">Classic Mueblería</title>
  <link th:href="@{/assets/vendor/bootstrap-5.3.8.min.css}" rel="stylesheet">
  <link th:href="@{/assets/vendor/fontawesome-7.2.0/css/all.min.css}" rel="stylesheet">
  <link th:href="@{/assets/css/craftorder.css}" rel="stylesheet">
</head>
<body style="background:var(--co-bg-page)">

<div class="d-flex" style="min-height:100vh">

  <!-- Sidebar -->
  <nav id="sidebar" th:fragment="menu"
       class="d-flex flex-column flex-shrink-0 p-0"
       style="width:260px;background:var(--co-sidebar-bg);min-height:100vh">

    <!-- Logo -->
    <div class="p-3 d-flex align-items-center"
         style="border-bottom:1px solid rgba(255,248,240,0.08)">
      <span class="fw-bold fs-5"
            style="color:var(--co-sidebar-active-text)">
        <i class="fa-solid fa-hammer me-2"
           style="color:var(--co-primary-light)"></i>
        Classic Mueblería
      </span>
    </div>

    <!-- Navegación -->
    <ul class="nav flex-column p-3 gap-1 flex-grow-1">

      <li class="nav-item"
          th:classappend="${seccionActiva == 'dashboard'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/dashboard}"
           th:style="${seccionActiva == 'dashboard'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-gauge fa-fw"></i>
          Dashboard
        </a>
      </li>

      <li class="nav-item"
          th:classappend="${seccionActiva == 'cotizaciones'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/cotizaciones}"
           th:style="${seccionActiva == 'cotizaciones'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-file-invoice fa-fw"></i>
          Cotizaciones
        </a>
      </li>

      <li class="nav-item"
          th:classappend="${seccionActiva == 'artesanos'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/artesanos}"
           th:style="${seccionActiva == 'artesanos'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-users fa-fw"></i>
          Artesanos
        </a>
      </li>

      <li class="nav-item"
          th:classappend="${seccionActiva == 'tiposmueble'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/tiposmueble}"
           th:style="${seccionActiva == 'tiposmueble'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-couch fa-fw"></i>
          Tipos de Mueble
        </a>
      </li>

      <li class="nav-item"
          th:classappend="${seccionActiva == 'materiales'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/materiales}"
           th:style="${seccionActiva == 'materiales'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-tree fa-fw"></i>
          Materiales
        </a>
      </li>

      <li class="nav-item"
          th:classappend="${seccionActiva == 'ordenes'} ? 'active' : ''">
        <a class="nav-link d-flex align-items-center gap-2 rounded px-3 py-2"
           th:href="@{/admin/ordenes}"
           th:style="${seccionActiva == 'ordenes'} ?
             'color:var(--co-sidebar-active-text);background:var(--co-primary)' :
             'color:var(--co-sidebar-text)'">
          <i class="fa-solid fa-screwdriver-wrench fa-fw"></i>
          Órdenes de Producción
        </a>
      </li>

    </ul>
  </nav>

  <!-- Contenido principal -->
  <div class="d-flex flex-column flex-grow-1">

    <!-- Navbar superior -->
    <nav th:fragment="header" class="navbar px-4 py-2 d-flex align-items-center
         justify-content-between"
         style="background:var(--co-sidebar-bg);
                border-bottom:1px solid rgba(255,248,240,0.08)">

      <!-- Hamburguesa -->
      <button class="btn border-0 p-1 js-sidebar-toggle"
              style="color:var(--co-sidebar-text)"
              aria-label="Toggle sidebar">
        <i class="fa-solid fa-bars fa-lg"></i>
      </button>

      <!-- Usuario -->
      <div class="d-flex align-items-center gap-2"
           style="color:var(--co-sidebar-text);cursor:pointer">
        <i class="fa-solid fa-circle-user fa-lg"></i>
        <span th:text="${session.usuarioNombre != null ?
                         session.usuarioNombre : 'Usuario'}">
          Usuario
        </span>
      </div>
    </nav>

    <!-- Zona de contenido (vistas hijas inyectan aquí) -->
    <main class="flex-grow-1 p-4">
      <div layout:fragment="contenido">
        <!-- contenido de la vista hija -->
      </div>
    </main>

  </div>
</div>

<!-- Scripts -->
<div th:fragment="footer">
  <script th:src="@{/assets/vendor/bootstrap-5.3.8.bundle.min.js}"></script>
  <script th:src="@{/assets/js/craftorder.js}"></script>
</div>

</body>
</html>
