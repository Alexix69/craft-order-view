<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{plantilla/base-artesano}">

<head>
  <meta charset="utf-8">
</head>

<body>

  <div layout:fragment="contenido">

    <div class="d-flex align-items-center gap-3 mb-4">
      <a th:href="@{/artesano/kanban}" class="btn btn-sm btn-outline-secondary">
        <i class="fa-solid fa-arrow-left me-1"></i>Volver a mi tablero
      </a>
      <h1 class="h4 fw-bold mb-0" style="color:var(--co-text-primary)">Detalle de mi orden</h1>
      <span th:class="'badge fs-6 ms-auto badge-estado-' + ${#strings.toLowerCase(orden.estadoActual)}"
            th:text="${orden.estadoActual}"></span>
    </div>

    <div class="row g-4">

      <!-- Datos del cliente -->
      <div class="col-md-6">
        <div class="card p-4 h-100" style="border:1px solid var(--co-border);border-radius:10px">
          <h6 class="fw-semibold mb-3" style="color:var(--co-text-secondary)">DATOS DEL CLIENTE</h6>
          <dl class="row mb-0" style="color:var(--co-text-primary)">
            <dt class="col-sm-5">Nombre</dt>
            <dd class="col-sm-7" th:text="${orden.nombreCliente}"></dd>
            <dt class="col-sm-5">Inicio</dt>
            <dd class="col-sm-7" th:text="${#temporals.format(orden.fechaInicio, 'dd/MM/yyyy HH:mm')}"></dd>
            <dt th:if="${orden.fechaFinalizacion != null}" class="col-sm-5">Finalización</dt>
            <dd th:if="${orden.fechaFinalizacion != null}" class="col-sm-7"
                th:text="${#temporals.format(orden.fechaFinalizacion, 'dd/MM/yyyy HH:mm')}"></dd>
          </dl>
        </div>
      </div>

      <!-- Configuración del mueble -->
      <div class="col-md-6">
        <div class="card p-4 h-100" style="border:1px solid var(--co-border);border-radius:10px">
          <h6 class="fw-semibold mb-3" style="color:var(--co-text-secondary)">CONFIGURACIÓN DEL MUEBLE</h6>
          <dl class="row mb-0" style="color:var(--co-text-primary)">
            <dt class="col-sm-5">Tipo</dt>
            <dd class="col-sm-7" th:text="${orden.tipoMuebleNombre}"></dd>
            <dt class="col-sm-5">Material</dt>
            <dd class="col-sm-7" th:text="${orden.materialNombre}"></dd>
            <dt class="col-sm-5">Acabado</dt>
            <dd class="col-sm-7" th:text="${orden.tipoAcabado}"></dd>
            <dt class="col-sm-5">Dimensiones</dt>
            <dd class="col-sm-7" th:text="${orden.altoCm} + '×' + ${orden.anchoCm}
                       + '×' + ${orden.profundidadCm} + ' cm'"></dd>
          </dl>
        </div>
      </div>

      <!-- Factura -->
      <div th:if="${orden.pdfUrl != null}" class="col-12">
        <div class="card p-4" style="border:1px solid var(--co-border);border-radius:10px">
          <h6 class="fw-semibold mb-3" style="color:var(--co-text-secondary)">FACTURA</h6>
          <a th:href="${orden.pdfUrl}" target="_blank" class="btn btn-primary">
            <i class="fa-solid fa-file-pdf me-1"></i>Descargar factura
          </a>
        </div>
      </div>

      <!-- Línea de tiempo -->
      <div class="col-12">
        <div class="card p-4" style="border:1px solid var(--co-border);border-radius:10px">
          <h6 class="fw-semibold mb-3" style="color:var(--co-text-secondary)">HISTORIAL</h6>
          <div th:each="evento : ${historial}" class="d-flex gap-3 mb-3">
            <div>
              <span th:if="${evento.tipoEvento == 'REASIGNACION'}" class="text-info fs-5">🔄</span>
              <span th:unless="${evento.tipoEvento == 'REASIGNACION'}">
                <span th:if="${evento.motivo != null}" class="text-warning fs-5">⚠️</span>
                <span th:unless="${evento.motivo != null}" class="text-success fs-5">✅</span>
              </span>
            </div>
            <div>
              <p class="mb-0 small fw-semibold"
                 th:text="${evento.tipoEvento == 'REASIGNACION' ? 'Reasignación de artesano' :
                           (evento.valorAnterior != null ?
                           evento.valorAnterior + ' → ' + evento.valorNuevo :
                           evento.valorNuevo)}">
              </p>
              <p class="mb-0 small text-muted"
                 th:text="${#temporals.format(evento.createdAt, 'dd/MM/yyyy HH:mm')}"></p>
              <p th:if="${evento.motivo != null}" class="mb-0 small fst-italic"
                 style="color:var(--co-text-muted)" th:text="'💬 ' + ${evento.motivo}"></p>
            </div>
          </div>
          <p th:if="${#lists.isEmpty(historial)}" class="text-muted mb-0">Sin eventos registrados.</p>
        </div>
      </div>

    </div>

  </div>

</body>

</html>
