<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
  layout:decorate="~{plantilla/base-admin}">

<head>
  <meta charset="utf-8">
</head>

<body>

<div layout:fragment="contenidopaginas">

  <!-- Spinner overlay -->
  <div id="kanbanSpinner"
       class="d-none position-fixed top-0 start-0 w-100 h-100
              d-flex align-items-center justify-content-center"
       style="background:rgba(0,0,0,0.5);z-index:9999">
    <div class="spinner-border text-light"
         style="width:3rem;height:3rem"></div>
  </div>

  <!-- Toast de error -->
  <div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
    <div id="kanbanToastError" class="toast align-items-center
         text-bg-danger border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="kanbanToastMensaje"></div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <h1 class="h4 fw-bold mb-4">Tablero de producción</h1>

  <!-- Error flash -->
  <div th:if="${error != null}"
       class="alert alert-danger alert-dismissible fade show mb-3">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
  </div>

  <!-- Buscador del Kanban -->
  <div class="card p-3 mb-3"
       style="border:1px solid var(--co-border);border-radius:10px">
    <div class="row g-2 align-items-end">

      <!-- Búsqueda por texto -->
      <div class="col-md-5">
        <label class="form-label small mb-1" for="kanbanBusqueda">Buscar</label>
        <input type="text"
               id="kanbanBusqueda"
               class="form-control form-control-sm"
               placeholder="Cliente, tipo de mueble o artesano..."
               oninput="filtrarKanban()">
      </div>

      <!-- Filtro por período -->
      <div class="col-md-4">
        <label class="form-label small mb-1" for="kanbanPeriodo">Período</label>
        <select id="kanbanPeriodo"
                class="form-select form-select-sm"
                onchange="filtrarKanban()">
          <option value="todos">Todos</option>
          <option value="hoy">Hoy</option>
          <option value="7">Últimos 7 días</option>
          <option value="15">Últimos 15 días</option>
          <option value="30">Últimos 30 días</option>
          <option value="90">Últimos 3 meses</option>
        </select>
      </div>

      <!-- Botón limpiar -->
      <div class="col-md-3">
        <button type="button"
                class="btn btn-sm btn-outline-secondary w-100"
                onclick="limpiarFiltroKanban()">
          <i class="fa-solid fa-xmark me-1"></i>Limpiar filtros
        </button>
      </div>

    </div>

    <!-- Contador de resultados -->
    <div class="mt-2">
      <small id="kanbanContador" class="text-muted"></small>
    </div>
  </div>

  <!-- Tablero Kanban -->
  <div class="kanban-board"
       id="kanban"
       th:attr="data-rol='ADMIN',data-usuario-id=${session.usuarioId}">

    <!-- Columna: SIN ASIGNAR -->
    <div class="kanban-columna"
         data-etapa="SIN_ASIGNAR">
      <div class="fw-semibold small mb-2 px-2 py-1 rounded"
           style="background:var(--co-bg-card);
                  color:var(--co-text-secondary)">
        Sin asignar
        <span class="badge bg-secondary ms-1"
              th:text="${sinAsignar.size()}">0</span>
      </div>
      <div th:each="cot : ${sinAsignar}">
        <div class="card mb-2 shadow-sm"
             style="border-left:4px solid #6c757d;border-radius:8px">
          <div class="card-body p-3">
            <h6 class="fw-bold mb-1 small"
                th:text="${cot.tipoMuebleNombre}"></h6>
            <p class="mb-1 small"
               th:text="${cot.nombreCliente}"></p>
            <p class="mb-2 small"
               th:text="'$' + ${#numbers.formatDecimal(
                 cot.costoAprobado,1,'COMMA',2,'POINT')}"></p>
            <button type="button"
                    class="btn btn-sm btn-primary w-100"
                    th:attr="onclick='abrirModalAsignar(' +
                             ${cot.id} + ')'">
              Asignar artesano
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Columnas de etapas de producción -->
    <div th:each="etapa : ${ {'ASIGNADO','CORTE','ENSAMBLADO',
                               'ACABADOS','CONTROL_CALIDAD','LISTO_ENTREGA'} }"
         class="kanban-columna"
         th:attr="data-etapa=${etapa}">

      <div class="fw-semibold small mb-2 px-2 py-1 rounded"
           style="background:var(--co-bg-card);
                  color:var(--co-text-secondary)"
           th:text="${etapa == 'ASIGNADO' ? 'Sin iniciar' :
                     etapa == 'CONTROL_CALIDAD' ? 'Control de calidad' :
                     etapa == 'LISTO_ENTREGA' ? 'Listo para entrega' :
                     #strings.capitalize(#strings.toLowerCase(etapa))}">
      </div>

      <div th:each="orden : ${ordenes}"
           th:if="${orden.estadoActual == etapa}">
        <div th:replace="~{fragmentos/tarjeta-kanban ::
             tarjeta(${orden}, 'ADMIN', '/admin/kanban')}">
        </div>
      </div>
    </div>

  </div>

  <!-- Modal: asignar artesano -->
  <div class="modal fade" id="modalAsignar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Asignar artesano</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal"></button>
        </div>
        <form id="formAsignar" action="/admin/kanban/asignar" method="post">
          <div class="modal-body">
            <input type="hidden" id="asignarCotizacionId"
                   name="cotizacionId">
            <div class="mb-3">
              <label class="form-label required-label">Artesano</label>
              <select class="form-select" name="artesanoId" required>
                <option value="">Selecciona un artesano...</option>
                <option th:each="a : ${artesanos}"
                        th:value="${a.id}"
                        th:text="${a.nombre}"></option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              Confirmar asignación
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal: retroceso de etapa (con motivo) -->
  <div class="modal fade" id="modalRetroceso" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Retroceder etapa</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>¿Retroceder de
            <strong id="retroceso-desde"></strong> a
            <strong id="retroceso-hasta"></strong>?
          </p>
          <div class="mb-3">
            <label class="form-label required-label">
              Motivo del retroceso
            </label>
            <textarea id="motivoRetroceso" class="form-control"
                      rows="3" required
                      placeholder="Explica por qué retrocede esta etapa..."></textarea>
            <div class="invalid-feedback">
              El motivo es obligatorio
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-warning"
                  onclick="confirmarRetroceso()">
            Confirmar retroceso
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: confirmar LISTO_ENTREGA -->
  <div class="modal fade" id="modalListoEntrega" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Confirmar entrega</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p>¿Confirmas que esta orden está lista para entrega?</p>
          <p class="small text-muted">
            Esta acción generará la factura automáticamente y
            notificará al cliente por correo. No se puede deshacer.
          </p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary"
                  data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-success"
                  onclick="confirmarListoEntrega()">
            Confirmar — Listo para entrega
          </button>
        </div>
      </div>
    </div>
  </div>

  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
      const rol      = /*[[${session.usuarioRol}]]*/ 'ADMIN';
      const userId   = /*[[${session.usuarioId}]]*/ null;
      initKanban(rol, userId);
    });

    function abrirModalAsignar(cotizacionId) {
      document.getElementById('asignarCotizacionId').value = cotizacionId;
      new bootstrap.Modal(
        document.getElementById('modalAsignar')).show();
    }
  </script>

</div>

</body>
</html>
