<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{plantilla/plantillaui}">
<head>
  <meta charset="utf-8">
</head>
<body>

<div layout:fragment="contenidopaginas">

  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h4 fw-bold mb-0">Gestión de Artesanos</h1>
    <button type="button" class="btn btn-primary"
            data-bs-toggle="modal" data-bs-target="#modalNuevo">
      <i class="bi bi-plus-lg me-1"></i>Nuevo Artesano
    </button>
  </div>

  <div class="card">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Fecha Registro</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr th:if="${#lists.isEmpty(lista)}">
            <td colspan="5" class="text-center py-4 text-muted">
              No hay artesanos registrados.
            </td>
          </tr>
          <tr th:each="usuario : ${lista}">
            <td th:text="${usuario.id}">1</td>
            <td>
              <span th:text="${usuario.nombre}">Nombre</span>
              <span class="badge-artesano ms-2">Artesano</span>
            </td>
            <td th:text="${usuario.email}">correo@ejemplo.com</td>
            <td th:text="${usuario.createdAt != null ? #temporals.format(usuario.createdAt, 'dd/MM/yyyy HH:mm') : '—'}">—</td>
            <td class="text-end">
              <a class="btn btn-sm btn-danger js-desactivar"
                 th:href="@{/admin/desactivar/{id}(id=${usuario.id})}">
                <i class="bi bi-person-x me-1"></i>Desactivar
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Modal: nuevo artesano -->
  <div class="modal fade" id="modalNuevo" tabindex="-1"
       aria-labelledby="modalNuevoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modalNuevoLabel">Nuevo Artesano</h5>
          <button type="button" class="btn-close"
                  data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <form th:action="@{/admin/guardar}" th:object="${artesano}" method="post">
          <div class="modal-body">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" class="form-control" id="nombre"
                     th:field="*{nombre}" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email"
                     th:field="*{email}" required>
            </div>
            <div class="mb-3">
              <label for="passwordHash" class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="passwordHash"
                     th:field="*{passwordHash}" required>
            </div>
            <input type="hidden" th:field="*{rol}" value="ARTESANO">
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary"
                    data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Confirmación de desactivación -->
  <script>
    document.querySelectorAll('.js-desactivar').forEach(function (enlace) {
      enlace.addEventListener('click', function (evento) {
        if (!confirm('¿Desactivar este artesano?')) {
          evento.preventDefault();
        }
      });
    });
  </script>

</div>
</body>
</html>
